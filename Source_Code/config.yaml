# DrowsyGuard Configuration
# CoderAxo Internship CAX-OL-2026-290
# Author: Muhammad Azeen Waqas

detection:
  backend: mediapipe
  ear_threshold: 0.27          # personalized during calibration
  mar_threshold: 0.65          # yawn detection threshold (YawDD)
  head_pitch_threshold: 20     # degrees - head nod alert
  drowsy_frames: 20            # frames before DROWSY (~1 sec at 20fps)
  hard_frames: 40              # frames before VERY_DROWSY (~2 sec)
  no_face_limit: 80            # frames no face = alert (~4 sec)
  perclos_limit: 0.15          # 15% eye closure = drowsy (Wierwille 1994)
  yawn_freq_limit: 3           # yawns per minute = drowsy (YawDD)
  yawn_frames: 15              # frames mouth open to count as yawn

alerts:
  soft_delay_seconds: 1
  hard_delay_seconds: 2
  audio_enabled: true
  visual_enabled: true

server:
  host: 0.0.0.0
  port: 8000

logging:
  enabled: true
  log_file: drowsy_events.csv
